   const h=310,w=h*full.width/full.height,x=(W-w)/2,y=195+Math.sin(t/300)*5;
   rr(x-8,y-8,w+16,h+16,18);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4a2c0a';ctx.stroke();
   ctx.save();rr(x,y,w,h,12);ctx.clip();ctx.drawImage(full,x,y,w,h);ctx.restore();
  }
  txt('Touche pour jouer',W/2,605,24,Math.floor(t/500)%2?'#fff':'#ffd54a');
 }
 if(state==='ready'){txt('Prêt ?',W/2,190,44);txt('Touche pour voler',W/2,230,22,'#ffd54a')}
 if(state==='playing'||state==='ready')txt(String(score),W/2,state==='ready'?120:90,52);
 if(state==='over'){
  rr(50,170,260,230,18);ctx.fillStyle='#fff3d6';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#4a2c0a';ctx.stroke();
  txt('PERDU !',W/2,235,40,'#ff6b3d');
  ctx.fillStyle='#4a2c0a';ctx.textAlign='center';ctx.font='700 20px system-ui,sans-serif';
  ctx.fillText('Score',W/2-60,285);ctx.fillText('Meilleur',W/2+60,285);
  ctx.font='900 44px "Arial Black",Impact,system-ui,sans-serif';
  ctx.fillText(score,W/2-60,335);ctx.fillText(best,W/2+60,335);
  ctx.font='700 18px system-ui,sans-serif';ctx.fillText('Touche pour rejouer',W/2,380);
 }
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/16.667,2.5);last=n;t=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
